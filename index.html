<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio Digital - Atividade Unidade 1</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>

<body class="dark-mode">

    <main class="clock-card">
        <button id="theme-toggle-btn" class="theme-btn" aria-label="Alternar Tema">
            <span id="theme-icon">☀️</span>
            <span id="theme-text">Modo Claro</span>
        </button>

        <div class="clock-display">
            <span id="hours">00</span>:<span id="minutes">00</span>:<span id="seconds">00</span>
        </div>

        <p id="date-display" class="date-display">Carregando data...</p>
    </main>

    <script src="scripts/main.js"></script>
</body>

</html>
